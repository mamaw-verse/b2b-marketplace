[PHP]
; Security hardening — "php2shell" disclosures (Oct 2026)
;
; CVE-2026-115560 (unpatched): RCE via session upload progress. PHP's official
; mitigation until the next bugfix release is to disable the feature entirely.
; Laravel never uses session upload progress, and this app never switches
; session.serialize_handler at runtime, so disabling it is safe.
session.upload_progress.enabled = 0

; CVE-2026-109619 hardening: blocks the confirmed fatal-error-backtrace path on
; PHP 8.5. No-op on PHP <= 8.4 (unknown ini entries are ignored).
fatal_error_backtraces = 0
